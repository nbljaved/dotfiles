; Output path for the EPOS IMPACT 860, see profile-sets/epos-impact-860.conf.
;
; Its own volume, 'PCM Playback Volume', is 16 steps that claim -12 to
; +12 dB.  The low steps are far quieter than claimed, so with the volume
; slider spread over them 30% was silent.  And the headset resets it to
; step 0 on every plug-in.  So pin it at 15, its max, each time the
; headset appears.  With no hardware volume left to merge, PipeWire does
; the slider in software.

[General]
priority = 99
description-key = analog-output

[Element PCM]
switch = mute
volume = 15
