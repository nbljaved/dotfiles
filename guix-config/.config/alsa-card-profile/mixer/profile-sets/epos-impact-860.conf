; EPOS IMPACT 860 (USB headset, 1395:0192), picked instead of default.conf
; by ~/.config/wireplumber/wireplumber.conf.d/51-epos-impact.conf.
;
; The same two mappings default.conf gives it, so the node names stay the
; same, but the output goes through epos-impact-860-output.

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = epos-impact-860-output
direction = output
priority = 15

[Mapping mono-fallback]
device-strings = hw:%f
channel-map = mono
paths-input = analog-input-headset-mic
direction = input
priority = 1
