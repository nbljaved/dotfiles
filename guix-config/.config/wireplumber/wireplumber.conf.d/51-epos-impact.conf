# EPOS IMPACT 860 (USB headset, 1395:0192).
monitor.alsa.rules = [
  # Pin its own volume at max and do the slider in software, otherwise
  # 30% is silent.  ~/.config/alsa-card-profile/mixer/paths/
  # epos-impact-860-output.conf says why.
  {
    matches = [
      { device.name = "~alsa_card.usb-DSEA_A_S_EPOS_IMPACT_860_.*" }
    ]
    actions = {
      update-props = {
        device.profile-set = "epos-impact-860.conf"
      }
    }
  }
  # It's a full-speed USB "batch" device, and for those PipeWire picks a
  # 128-frame period with 128 frames of headroom.  That's too little: the
  # PCM drains before PipeWire refills it and stays in XRUN ("front:2p:
  # snd_pcm_avail after recover: Broken pipe" over and over in
  # ~/.local/state/shepherd/shepherd.log), so nothing plays and YouTube
  # just buffers.  A bigger period and headroom keep it fed.
  {
    matches = [
      { node.name = "~alsa_output.usb-DSEA_A_S_EPOS_IMPACT_860_.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.headroom    = 1024
      }
    }
  }
]
